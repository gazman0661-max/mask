name: okey101
description: 101 Okey - frontend iskeleti
publish_to: none
version: 0.1.0
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  flutter_web_auth_2: ^4.1.0   # Google bağlama/giriş: tarayıcı penceresi + okey101://login-callback dönüşü
  audioplayers: ^6.1.0   # ses efektleri (assets/sounds)
  google_mobile_ads: ^5.3.1   # banner reklam (ADS=admob ile açılır; bkz. widgets/ad_banner.dart)
  android_id: ^0.4.0   # misafir hesabı: uygulama verisi silinse de aynı kalan Android cihaz kimliği
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/brand/
