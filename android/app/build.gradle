plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase: android/app/google-services.json VARSA eklentiler kendiliğinden devreye girer; yoksa hiçbiri
// uygulanmaz ve derleme/oyun aynen çalışır (Telemetry kapalı kalır).
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
}

android {
    namespace "com.astrofelyx.pro"
    compileSdk 36   // Worlds Merge ile aynı (LevelPlay eklentisi için)
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true   // flutter_local_notifications (yerel bildirim) için
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.astrofelyx.pro"
        minSdkVersion 24   // LevelPlay en az 23 ister; Worlds Merge ile aynı
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // UNSIGNED_AAB=true (GitHub Actions'taki AAB işi): İMZASIZ üretilir; imzayı bilgisayardan jarsigner ile atarsın.
            // Başka her durumda debug anahtarı (yerelde `flutter run --release` çalışsın diye). Play'e debug imzalı dosya YÜKLEME.
            if (System.getenv("UNSIGNED_AAB") != "true") {
                signingConfig signingConfigs.debug
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'   // flutter_local_notifications
    // --- Unity LevelPlay (ironSource) mediation (Worlds Merge ile AYNI sürümler) ---
    // LevelPlay SDK'sının kendisi unity_levelplay_mediation eklentisiyle gelir (pubspec).
    // Eklentinin README'si bu Play Services bağımlılıklarını app seviyesinde ister.
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-basement:18.3.0'

    // --- Reklam ağı adaptörleri (ağ başına adaptör) ---
    // Unity Ads. 5.15.0 ve üzeri adaptör Unity Ads SDK'sını içinde getirir; ayrı unity-ads satırı gerekmez.
    // Başka ağ (ör. ironSource ağının kendi adaptörü, Pangle, Mintegral...) açılırsa onun adaptörü de buraya eklenir;
    // eklenmeyen ağa istek gitmez. Sürümler LevelPlay panelindeki "Mediation networks" tablosuna göre seçilir.
    implementation 'com.unity3d.ads-mediation:unityads-adapter:5.15.0'
}
