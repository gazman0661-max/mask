plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.okey101"
    compileSdk 36   // Worlds Merge ile aynı (LevelPlay eklentisi için)
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.okey101"
        minSdkVersion 24   // LevelPlay en az 23 ister; Worlds Merge ile aynı
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // --- Unity LevelPlay (ironSource) mediation (Worlds Merge ile AYNI sürümler) ---
    // LevelPlay SDK'sının kendisi unity_levelplay_mediation eklentisiyle gelir (pubspec).
    // Eklentinin README'si bu Play Services bağımlılıklarını app seviyesinde ister.
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-basement:18.3.0'

    // --- Reklam ağı adaptörleri (ağ başına adaptör) ---
    // Unity Ads. 5.15.0 ve üzeri adaptör Unity Ads SDK'sını içinde getirir; ayrı unity-ads satırı gerekmez.
    // Başka ağ (ör. ironSource ağının kendi adaptörü, Pangle, Mintegral...) açılırsa onun adaptörü de buraya eklenir;
    // eklenmeyen ağa istek gitmez. Sürümler LevelPlay panelindeki "Mediation networks" tablosuna göre seçilir.
    implementation 'com.unity3d.ads-mediation:unityads-adapter:5.15.0'
}
